<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #999;
            font-size: 1.1em;
        }

        .joke-container {
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f2f5 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 5px solid #667eea;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .joke-type {
            color: #667eea;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .joke-text {
            color: #333;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .joke-answer {
            color: #667eea;
            font-size: 1.1em;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
            display: none;
            font-weight: 600;
        }

        .joke-answer.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.1em;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 30px;
            font-size: 1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 200px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f5f7fa;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .category-select {
            padding: 12px 15px;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            color: #333;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .stats {
            background: #f5f7fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #999;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .error-message {
            background: #ffe6e6;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            border-left: 4px solid #c33;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        .joke-container.two-part {
            min-height: auto;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .button-group {
                flex-direction: column;
            }

            .btn-primary {
                min-width: auto;
            }

            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <header>
                <h1>😂 Joke Generator</h1>
                <p class="subtitle">Get random jokes instantly!</p>
            </header>

            <div class="category-section">
                <label for="category" style="color: #333; font-weight: bold; display: block; margin-bottom: 10px;">
                    📂 Select Category:
                </label>
                <select id="category" class="category-select">
                    <option value="any">Any Category</option>
                    <option value="general">General</option>
                    <option value="programming">Programming</option>
                    <option value="knock-knock">Knock-Knock</option>
                </select>
            </div>

            <div class="joke-container" id="jokeContainer" style="display: none;">
                <div class="joke-type" id="jokeType">Joke</div>
                <div class="joke-text" id="jokeText"></div>
                <div class="joke-answer" id="jokeAnswer"></div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading a hilarious joke...</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="button-group">
                <button class="btn-primary" onclick="getJoke()">Get Random Joke</button>
                <button class="btn-secondary" onclick="toggleAnswer()" id="answerBtn" style="display: none;">Show Answer</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="jokeCount">0</div>
                    <div class="stat-label">Jokes Loaded</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="categoryCount">-</div>
                    <div class="stat-label">Current Category</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="typeCount">-</div>
                    <div class="stat-label">Joke Type</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let jokeCount = 0;
        let currentJoke = null;

        // JokeAPI endpoints
        const API_BASE = 'https://v2.jokeapi.dev/joke/';

        async function getJoke() {
            const category = document.getElementById('category').value;
            const endpoint = category === 'any' 
                ? `${API_BASE}Any` 
                : `${API_BASE}${category.charAt(0).toUpperCase() + category.slice(1)}`;

            showLoading(true);
            hideError();
            document.getElementById('jokeContainer').style.display = 'none';
            document.getElementById('answerBtn').style.display = 'none';

            try {
                const response = await fetch(`${endpoint}?format=json`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                currentJoke = await response.json();
                displayJoke(currentJoke);
                jokeCount++;
                updateStats();

            } catch (error) {
                showError('Oops! Could not fetch a joke. Please try again later.');
                console.error('Error:', error);
            } finally {
                showLoading(false);
            }
        }

        function displayJoke(joke) {
            const jokeContainer = document.getElementById('jokeContainer');
            const jokeTypeEl = document.getElementById('jokeType');
            const jokeTextEl = document.getElementById('jokeText');
            const jokeAnswerEl = document.getElementById('jokeAnswer');
            const answerBtn = document.getElementById('answerBtn');

            jokeTypeEl.textContent = joke.type.toUpperCase();
            jokeContainer.className = 'joke-container';

            if (joke.type === 'single') {
                jokeTextEl.textContent = joke.joke;
                jokeAnswerEl.classList.remove('show');
                answerBtn.style.display = 'none';
                document.getElementById('typeCount').textContent = 'Single';
            } else if (joke.type === 'twopart') {
                jokeTextEl.textContent = joke.setup;
                jokeAnswerEl.textContent = joke.delivery;
                jokeAnswerEl.classList.remove('show');
                answerBtn.style.display = 'block';
                answerBtn.textContent = 'Show Answer';
                jokeContainer.classList.add('two-part');
                document.getElementById('typeCount').textContent = 'Two-part';
            }

            jokeContainer.style.display = 'block';

            // Update category stat
            const category = joke.category || 'Any';
            document.getElementById('categoryCount').textContent = category;
        }

        function toggleAnswer() {
            const answerEl = document.getElementById('jokeAnswer');
            const answerBtn = document.getElementById('answerBtn');

            if (answerEl.classList.contains('show')) {
                answerEl.classList.remove('show');
                answerBtn.textContent = 'Show Answer';
            } else {
                answerEl.classList.add('show');
                answerBtn.textContent = 'Hide Answer';
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = '❌ ' + message;
            errorEl.classList.add('show');
        }

        function hideError() {
            const errorEl = document.getElementById('errorMessage');
            errorEl.classList.remove('show');
        }

        function updateStats() {
            document.getElementById('jokeCount').textContent = jokeCount;
        }

        // Event listeners
        document.getElementById('category').addEventListener('change', function() {
            document.getElementById('jokeContainer').style.display = 'none';
            document.getElementById('answerBtn').style.display = 'none';
            document.getElementById('jokeAnswer').classList.remove('show');
        });

        // Load initial joke on page load
        window.addEventListener('load', function() {
            getJoke();
        });
    </script>
</body>
</html>
