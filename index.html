<html lang="uz">
<head>
    <meta charset="UTF-8">

    <title>Super Info App - Barcha Ma'lumotlar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-in;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-container {
            max-width: 600px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }

        .search-box {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .search-btn {
            padding: 15px 30px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-top: 40px;
        }

        .games-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .games-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .games-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .game-item {
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
            text-align: left;
        }

        .game-item:hover {
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .game-item.active {
            background: #ff6b6b;
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }

        .content-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-card {
            background: #f5f5f5;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .video-thumbnail {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3em;
        }

        .video-info {
            padding: 15px;
        }

        .video-info h3 {
            color: #333;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .video-info p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .shorts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .short-card {
            background: #f5f5f5;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .short-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .short-thumbnail {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8787 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5em;
        }

        .short-info {
            padding: 10px;
        }

        .short-info h4 {
            color: #333;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .info-card {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s;
            border-left: 5px solid #667eea;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .info-card h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .info-card p {
            color: #666;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .special-info {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1em;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .videos-grid {
                grid-template-columns: 1fr;
            }

            .shorts-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        let currentGame = 'PUBG';

        // O'yinlarni o'rnatish
        function initializeGames() {
            const gamesList = document.getElementById('gamesList');
            gamesList.innerHTML = games.map(game => `
                <button class="game-item ${game.name === 'PUBG' ? 'active' : ''}" 
                        onclick="selectGame('${game.name}')">
                    ${game.icon} ${game.name}
                </button>
            `).join('');
        }

        // O'yin tanlash
        function selectGame(gameName) {
            currentGame = gameName;
            
            // Active tugmani o'zgartirah
            document.querySelectorAll('.game-item').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.includes(gameName)) {
                    btn.classList.add('active');
                }
            });

            // Tab-larni yangilash
            updateVideos();
            updateShorts();
            updateInfo();
        }

        // Videolarni yangilash
        function updateVideos() {
            const container = document.getElementById('videosContainer');
            container.innerHTML = videos.map(video => `
                <div class="video-card">
                    <div class="video-thumbnail">${video.emoji}</div>
                    <div class="video-info">
                        <h3>${video.title}</h3>
                        <p>${video.description}</p>
                        <p style="color: #999;">⏱️ ${video.duration} | 👁️ ${video.views}</p>
                    </div>
                </div>
            `).join('');
        }

        // Shorts-larni yangilash
        function updateShorts() {
            const container = document.getElementById('shortsContainer');
            container.innerHTML = shorts.map(short => `
                <div class="short-card">
                    <div class="short-thumbnail">${short.emoji}</div>
                    <div class="short-info">
                        <h4>${short.title}</h4>
                        <p>⏱️ ${short.duration}</p>
                    </div>
                </div>
            `).join('');
        }

        // Ma'lumotlarni yangilash
        function updateInfo() {
            const container = document.getElementById('infoContainer');
            const info = allInfo[currentGame] || [];
            
            container.innerHTML = info.map(item => `
                <div class="info-card">
                    <h4>${item.emoji} ${item.name}</h4>
                    <p><strong>📍 Joylashuv:</strong> ${item.location}</p>
                    <p><strong>🎯 Foydalanish:</strong> ${item.use}</p>
                    <p><strong>❓ Nima uchun kerak:</strong> ${item.need}</p>
                    <p><strong>⭐ Kamiyligim:</strong> ${item.rarity}</p>
                    ${item.special ? `<div class="special-info">${item.special}</div>` : ''}
                </div>
            `).join('');
        }

        // Tab almashtirish
        function switchTab(tabName) {
            // Barcha tab-contnet-ni yashirish
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Tanlangan tab-ni ko'rsatish
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Qidirish
        function searchContent() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!searchValue) {
                alert('Iltimos qidiruv so\'zini kiriting!');
                return;
            }

            // Qidiruv natijalarini filtrlash
            let found = false;
            const infoContainer = document.getElementById('infoContainer');
            
            // Barcha o'yinlardan qidirish
            let results = [];
            Object.keys(allInfo).forEach(game => {
                allInfo[game].forEach(item => {
                    if (item.name.toLowerCase().includes(searchValue) ||
                        item.location.toLowerCase().includes(searchValue) ||
                        item.use.toLowerCase().includes(searchValue)) {
                        results.push({ game, item });
                        found = true;
                    }
                });
            });

            if (found) {
                infoContainer.innerHTML = results.map(result => `
                    <div class="info-card">
                        <h4>🎮 ${result.game}</h4>
                        <h4>${result.item.emoji} ${result.item.name}</h4>
                        <p><strong>📍 Joylashuv:</strong> ${result.item.location}</p>
                        <p><strong>🎯 Foydalanish:</strong> ${result.item.use}</p>
                        <p><strong>❓ Nima uchun kerak:</strong> ${result.item.need}</p>
                        <p><strong>⭐ Kamiyligim:</strong> ${result.item.rarity}</p>
                        ${result.item.special ? `<div class="special-info">${result.item.special}</div>` : ''}
                    </div>
                `).join('');
                document.querySelector('[onclick="switchTab(\'info\')"]').click();
            } else {
                infoContainer.innerHTML = `<div class="no-data">❌ "${searchValue}" haqida ma'lumot topilmadi</div>`;
                document.querySelector('[onclick="switchTab(\'info\')"]').click();
            }
        }

        // Enter tugmasida qidirish
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchContent();
                }
            });

            // Dasturni o'rnatish
            initializeGames();
            updateVideos();
            updateShorts();
            updateInfo();
        });
    </script>
